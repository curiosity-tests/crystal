          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  test-interpreter-primitives_spec:
    needs: build-interpreter
    runs-on: ubuntu-24.04
    container:
      image: crystallang/crystal:1.21.0-build
    name: "Test primitives_spec with interpreter"
    steps:
