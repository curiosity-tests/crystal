            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  test-interpreter-std_spec:
    needs: build-interpreter
    runs-on: ubuntu-24.04
    container:
      image: crystallang/crystal:1.21.0-build
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    name: "Test std_spec with interpreter (${{ matrix.part }})"
    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
        persist-credentials: false
    - name: Download compiler artifact
      uses: actions/download-artifact@v8
      with:
        name: crystal-interpreter
        path: .build/

    - name: Mark downloaded compiler as executable
      run: chmod +x .build/crystal

    - name: Run std_spec with interpreter
      run: SPEC_SPLIT="${{ matrix.part }}%4" bin/crystal i spec/std_spec.cr -- --junit_output .junit/interpreter-std_spec.${{ matrix.part }}.xml

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
